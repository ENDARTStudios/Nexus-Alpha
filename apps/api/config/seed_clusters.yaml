version: 1

# Clusters curados para corroboração cross-domain REAL (#048, audit #058).
# Regras: >= 3 domínios distintos por cluster; >= 2 publishers; ao menos 1 fora de
# wikipedia.org; URLs validadas (HTTPS, HTTP 200 auditado em #058). Fatos duráveis
# (fundação, estádio, ídolos) — sem datas isoladas como objeto (span validator #050).
#
# Auditoria #058 (2026-09-23): 22 URLs avaliadas → 8 produtivas (todas wikipedia),
# 4 fracas, 10 improdutivas. **Nenhuma fonte não-wiki de futebol é produtiva** —
# anotado honestamente por fonte; não forçamos URL lixo (404/JS descartadas).
#
# #048.5 (2026-09-26): gazetadoparana produtiva (SER) no cluster garrincha_botafogo.
# #048.6 batch 3 (2026-09-27): RSSSF produtiva (VENCEU tabular, dry-run #058.12
# 9/9 gates) nos clusters de honras abaixo — primeira fonte tabular independente.
defaults:
  min_distinct_domains: 3
  min_distinct_publishers: 2
  require_non_wikipedia_publisher: true

