version: "3.8"

services:
  nexus-core:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: nexus_core_engine
    volumes:
      - ./apps/api/src:/app/src
      - ./apps/api/config:/app/config
    environment:
      - NEO4J_URI=bolt://neo4j-db:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=NexusSecurePass2026
    depends_on:
      - neo4j-db

  nexus-web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile.web
    container_name: nexus_web_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_NEXUS_API_URL=${NEXT_PUBLIC_NEXUS_API_URL:-}
    depends_on:
      - nexus-core

  neo4j-db:
    image: neo4j:5.12-community
    container_name: nexus_graph_db
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/NexusSecurePass2026
    volumes:
      - neo4j_data:/data

volumes:
  neo4j_data:
