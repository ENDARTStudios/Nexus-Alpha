version: "3.8"

services:
  nexus-core:
    build: .
    container_name: nexus_core_engine
    volumes:
      - ./src:/app/src
      - ./config:/app/config
    environment:
      - NEO4J_URI=bolt://neo4j-db:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=NexusSecurePass2026
    depends_on:
      - neo4j-db

  neo4j-db:
    image: neo4j:5.12-community
    container_name: nexus_graph_db
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/NexusSecurePass2026
    volumes:
      - neo4j_data:/data

volumes:
  neo4j_data: