name: Nexus-Alpha Autonomous Worker Cron

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  mine-and-evolve:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar o Repositório
        uses: actions/checkout@v4

      - name: Configurar Ambiente Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Instalar Dependências Operacionais
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar Motor de Mineração e Ingestão
        env:
          NEXUS_API_TOKEN: ${{ secrets.NEXUS_API_TOKEN }}
          HF_SPACE_URL: ${{ secrets.HF_SPACE_URL }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/worker_cycle.py