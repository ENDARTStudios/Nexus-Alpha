name: Nexus-Alpha Weekly Safety Backup
# #054.7+: backup REAL do grafo (o workflow anterior gravava payload simulado,
# não um dump — nunca tratá-lo como backup). Usa a mesma ferramenta do backup
# de referência 8ed58ea (export → manifest SHA256 → verify disponível).
on:
  schedule:
    # Executa pontualmente todo domingo à meia-noite (Custo Zero de infraestrutura)
    - cron: '0 0 * * 0'
  workflow_dispatch: # Permite disparar um backup sob demanda
permissions:
  contents: write
concurrency:
  group: weekly-graph-backup
  cancel-in-progress: false
jobs:
  run-backup:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Clonar o Repositorio
      uses: actions/checkout@v4

    - name: 2. Configurar Python + driver Neo4j
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: 3. Instalar dependências
      run: pip install "neo4j>=5" python-dotenv

    - name: 4. Export real do grafo (read-only, com retry de cold boot)
      env:
        NEO4J_URI: ${{ secrets.NEO4J_URI }}
        NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
      run: |
        echo "Dump real: nos + relacoes + schema (manifest com SHA256 e contagens)"
        cd apps/api
        python scripts/aura_final_backup.py export --out ../../backups/auto_weekly

    - name: 5. Comprimir dump (o manifest descreve o JSON original — verificar com gunzip | sha256sum)
      run: gzip -f backups/auto_weekly/graph_export.json

    - name: 6. Commit e Push do Backup
      run: |
        git config --global user.name "Nexus-Alpha Bot"
        git config --global user.email "nexus-bot@endartstudios.internal"
        git add backups/auto_weekly
        if git diff --cached --quiet; then
          echo "Nenhuma alteracao detectada no grafo. Pulando commit de seguranca."
        else
          git commit -m "backup(graph): weekly automated export [skip ci]"
          git push origin main
        fi
